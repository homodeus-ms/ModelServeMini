apiVersion: apps/v1
kind: Deployment

metadata:
  name: completion-worker

spec:
  replicas: {{ .Values.completionWorker.replicas }}

  selector:
    matchLabels:
      app: completion-worker

  template:
    metadata:
      labels:
        app: completion-worker

    spec:
      containers:
        - name: completion-worker
          image: "{{ .Values.image.cpu.repository }}:{{ .Values.image.cpu.tag }}"
          imagePullPolicy: {{ .Values.image.cpu.pullPolicy }}

          command:
            - python

          args:
            - -m
            - app.kafka.completion_consumer

          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: {{ .Values.kafka.bootstrapServers | quote }}

            - name: KAFKA_TOPIC
              value: {{ .Values.kafka.topics.completion.name | quote }}

            - name: KAFKA_GROUP_ID
              value: {{ .Values.completionWorker.groupId | quote }}

            - name: DATABASE_URL
              value: {{ .Values.database.url | quote }}

            - name: REDIS_HOST
              value: {{ .Values.redis.host | quote }}

            - name: REDIS_PORT
              value: {{ .Values.redis.port | quote }}