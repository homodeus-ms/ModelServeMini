apiVersion: v1
kind: Service
metadata:
  name: kafka

spec:
  selector:
    app: kafka

  ports:
    - name: external
      port: {{ .Values.kafka.ports.external }}
      targetPort: {{ .Values.kafka.ports.external }}

    - name: internal
      port: {{ .Values.kafka.ports.internal }}
      targetPort: {{ .Values.kafka.ports.internal }}

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka

spec:
  serviceName: kafka
  replicas: {{ .Values.kafka.replicas }}

  selector:
    matchLabels:
      app: kafka

  template:
    metadata:
      labels:
        app: kafka

    spec:
      containers:
        - name: kafka
          image: "{{ .Values.kafka.image.repository }}:{{ .Values.kafka.image.tag }}"

          ports:
            - containerPort: {{ .Values.kafka.ports.external }}
            - containerPort: {{ .Values.kafka.ports.internal }}
            - containerPort: {{ .Values.kafka.ports.controller }}

          env:
            - name: KAFKA_NODE_ID
              value: {{ .Values.kafka.nodeId | quote }}

            - name: KAFKA_PROCESS_ROLES
              value: {{ .Values.kafka.processRoles | quote }}

            - name: KAFKA_LISTENERS
              value: {{ .Values.kafka.listeners | quote }}

            - name: KAFKA_ADVERTISED_LISTENERS
              value: {{ .Values.kafka.advertisedListeners | quote }}

            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: {{ .Values.kafka.listenerSecurityProtocolMap | quote }}

            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: {{ .Values.kafka.interBrokerListenerName | quote }}

            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: {{ .Values.kafka.controllerListenerNames | quote }}

            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: {{ .Values.kafka.controllerQuorumVoters | quote }}

            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: {{ .Values.kafka.offsetsTopicReplicationFactor | quote }}

          volumeMounts:
            - name: kafka-data
              mountPath: {{ .Values.kafka.storage.mountPath | quote }}

  volumeClaimTemplates:
    - metadata:
        name: kafka-data

      spec:
        accessModes:
          - {{ .Values.kafka.storage.accessMode }}

        resources:
          requests:
            storage: {{ .Values.kafka.storage.size }}