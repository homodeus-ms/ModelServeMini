apiVersion: apps/v1
kind: Deployment

metadata:
  name: cpu-worker

spec:
  replicas: {{ .Values.cpuWorker.replicas }}

  selector:
    matchLabels:
      app: cpu-worker

  template:
    metadata:
      labels:
        app: cpu-worker

    spec:
      containers:
        - name: cpu-worker
          image: "{{ .Values.image.cpu.repository }}:{{ .Values.image.cpu.tag }}"
          imagePullPolicy: {{ .Values.image.cpu.pullPolicy }}

          command:
            - python

          args:
            - -m
            - app.kafka.cpu_consumer

          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: {{ .Values.kafka.bootstrapServers | quote }}

            - name: KAFKA_TOPIC
              value: {{ .Values.kafka.topics.cpu.name | quote }}

            - name: KAFKA_GROUP_ID
              value: {{ .Values.cpuWorker.groupId | quote }}

            - name: WORKER_DEVICE
              value: {{ .Values.cpuWorker.device | quote }}

            - name: DATABASE_URL
              value: {{ .Values.database.url | quote }}

            - name: DATASET_STORAGE_PATH
              value: {{ .Values.storage.datasetPath | quote }}

            - name: MODEL_STORAGE_PATH
              value: {{ .Values.storage.modelPath | quote }}

            - name: REDIS_HOST
              value: {{ .Values.redis.host | quote }}

            - name: REDIS_PORT
              value: {{ .Values.redis.port | quote }}

          volumeMounts:
            - name: storage
              mountPath: {{ .Values.storage.mountPath | quote }}

      volumes:
        - name: storage
          hostPath:
            path: {{ .Values.storage.hostPath | quote }}
            type: Directory