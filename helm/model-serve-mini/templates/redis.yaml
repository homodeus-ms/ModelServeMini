apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis

spec:
  replicas: {{ .Values.redis.replicas }}

  selector:
    matchLabels:
      app: redis

  template:
    metadata:
      labels:
        app: redis

    spec:
      containers:
        - name: redis
          image: "{{ .Values.redis.image.repository }}:{{ .Values.redis.image.tag }}"

          ports:
            - containerPort: {{ .Values.redis.port }}

---
apiVersion: v1
kind: Service
metadata:
  name: redis

spec:
  selector:
    app: redis

  ports:
    - port: {{ .Values.redis.port }}
      targetPort: {{ .Values.redis.port }}