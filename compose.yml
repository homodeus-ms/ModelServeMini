services:

  db:
    image: postgres:17
    container_name: model-serve-mini-db

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5433:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10


  kafka:
    image: apache/kafka:4.1.0
    container_name: model-serve-mini-kafka

    ports:
      - "9092:9092"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: >
        EXTERNAL://:9092,
        INTERNAL://:29092,
        CONTROLLER://:9093

      KAFKA_ADVERTISED_LISTENERS: >
        EXTERNAL://localhost:9092,
        INTERNAL://kafka:29092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: >
        EXTERNAL:PLAINTEXT,
        INTERNAL:PLAINTEXT,
        CONTROLLER:PLAINTEXT

      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1


  kafka-init:
    image: apache/kafka:4.1.0

    depends_on:
      kafka:
        condition: service_started

    entrypoint: ["/bin/bash", "-c"]

    command:
      - |
        echo "Waiting for Kafka..."

        until /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka:29092 \
          --list > /dev/null 2>&1
        do
          echo "Kafka is not ready yet..."
          sleep 2
        done

        echo "Creating CPU topic..."

        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka:29092 \
          --create \
          --if-not-exists \
          --topic training-jobs-cpu \
          --partitions 3 \
          --replication-factor 1

        echo "Creating GPU topic..."

        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka:29092 \
          --create \
          --if-not-exists \
          --topic training-jobs-gpu \
          --partitions 1 \
          --replication-factor 1

        echo "Creating Completion topic..."

        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka:29092 \
          --create \
          --if-not-exists \
          --topic training-job-completed \
          --partitions 1 \
          --replication-factor 1

        echo "Kafka topics initialized."


  redis:
    image: redis:8
    container_name: model-serve-mini-redis

    ports:
      - "6379:6379"


  api:
    build: .

    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000

    environment:
      DATABASE_URL: ${DATABASE_URL}

      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}

      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}

      DATASET_STORAGE_PATH: ${DATASET_STORAGE_PATH}
      MODEL_STORAGE_PATH: ${MODEL_STORAGE_PATH}

      ENABLE_GPU_TRAINING: ${ENABLE_GPU_TRAINING}

    ports:
      - "8000:8000"

    volumes:
      - ./storage:/app/storage

    depends_on:
      db:
        condition: service_healthy

      kafka-init:
        condition: service_completed_successfully

      redis:
        condition: service_started

      db-init:
        condition: service_completed_successfully


  cpu-worker:
    build: .

    command: python -m app.kafka.cpu_consumer

    environment:
      DATABASE_URL: ${DATABASE_URL}

      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      KAFKA_TOPIC: ${KAFKA_CPU_TOPIC}
      KAFKA_GROUP_ID: cpu-training-workers

      WORKER_DEVICE: cpu

      DATASET_STORAGE_PATH: ${DATASET_STORAGE_PATH}
      MODEL_STORAGE_PATH: ${MODEL_STORAGE_PATH}

    volumes:
      - ./storage:/app/storage

    depends_on:
      db:
        condition: service_healthy

      kafka-init:
        condition: service_completed_successfully

      db-init:
        condition: service_completed_successfully


  completion-worker:
    build: .

    command: python -m app.kafka.completion_consumer

    environment:
      DATABASE_URL: ${DATABASE_URL}

      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      KAFKA_TOPIC: ${KAFKA_COMPLETION_TOPIC}
      KAFKA_GROUP_ID: training-completion-workers

      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}

    depends_on:
      db:
        condition: service_healthy

      kafka-init:
        condition: service_completed_successfully

      redis:
        condition: service_started

      db-init:
        condition: service_completed_successfully

  db-init:
    build: .

    command: python -m app.db.init_db

    environment:
      DATABASE_URL: ${DATABASE_URL}

    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres-data: